<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#17324d"><title>Students | SatGold Cloud</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/portal.css"></head>
<body class="portal-body">
  <header class="site-header"><a class="brand" href="/"><img src="satgold-cloud-logo.svg" alt="SatGold Cloud" width="205" height="54"></a><div class="header-user"><a class="text-link" href="/dashboard.html">Workspace</a><button id="sign-out" class="button button-small" type="button">Sign out</button></div></header>
  <main class="workspace-main">
    <div class="workspace-heading"><div><p class="eyebrow">SCHOOL ADMINISTRATION</p><h1>Students and guardians</h1><p id="page-status" class="portal-intro" aria-live="polite">Loading your schools...</p></div></div>
    <section class="student-admin-grid">
      <form id="student-form" class="portal-card portal-card-wide">
        <h2>Create a student account</h2><p class="portal-intro">The student and parent accounts will be linked to this school. A temporary student login will be emailed to the guardian.</p>
        <label>School<select id="school-id" name="schoolId" required></select></label>
        <div class="form-grid">
          <label>First name<input name="firstName" required maxlength="80"></label><label>Last name<input name="lastName" required maxlength="80"></label>
          <label>Other names <span class="optional">(optional)</span><input name="otherNames" maxlength="100"></label><label>Class<select id="class-id" name="classId" required><option value="">Choose a class</option></select></label>
          <label>Class arm <span class="optional">(optional)</span><select id="class-arm-id" name="classArmId"><option value="">No arm</option></select></label>
          <label>Student number <span class="optional">(generated automatically)</span><input disabled value="Generated on save"></label>
          <label>Guardian first name<input name="guardianFirstName" required maxlength="80"></label><label>Guardian last name<input name="guardianLastName" required maxlength="80"></label>
          <label>Guardian email<input name="guardianEmail" type="email" required maxlength="254"></label><label>Guardian phone <span class="optional">(optional)</span><input name="guardianPhone" type="tel" maxlength="32"></label>
          <label class="span-two">Relationship <span class="optional">(optional)</span><input name="relationship" maxlength="40" placeholder="Parent, guardian, caregiver"></label>
        </div>
        <button class="button button-wide" type="submit">Create linked accounts <span aria-hidden="true">↗</span></button><p id="form-notice" class="form-notice" aria-live="polite"></p>
      </form>
      <section class="student-register"><h2>Student register</h2><div id="student-list" class="student-list"><p class="empty-state">Choose a school to view its students.</p></div></section>
    </section>
  </main>
  <script type="module" src="assets/js/students.js"></script>
</body>
</html>
