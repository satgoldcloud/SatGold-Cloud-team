<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Register your school | SatGold Cloud</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/portal.css"></head>
<body class="portal-body"><header class="site-header"><a class="brand" href="/"><img src="satgold-cloud-logo.svg" alt="SatGold Cloud" width="205" height="54"></a><a class="text-link" href="/login.html">Sign in ↗</a></header><main class="portal-main"><section class="portal-card portal-card-wide"><p class="eyebrow">START YOUR SCHOOL WORKSPACE</p><h1>Bring your school<br><span>together.</span></h1><p class="portal-intro">Create the school owner account. We’ll email a verification link before you can sign in.</p><form id="register-form"><div class="form-grid"><label>School name<input name="schoolName" autocomplete="organization" minlength="2" maxlength="120" required></label><label>Your full name<input name="ownerName" autocomplete="name" minlength="2" maxlength="120" required></label><label>Owner email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>School contact email <span class="optional">(optional)</span><input name="contactEmail" type="email" autocomplete="email" maxlength="254"></label><label class="span-two">Create a password<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><small>Use at least 10 characters.</small></label></div><button class="button button-wide" type="submit">Register school <span>↗</span></button><p id="form-notice" class="form-notice" aria-live="polite"></p></form><p class="portal-foot">Already registered? <a href="/login.html">Sign in</a></p></section></main><script type="module" src="assets/js/register.js"></script></body></html>
