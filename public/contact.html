<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Contact | SatGold Cloud</title><meta name="description" content="Contact SatGold Cloud about school onboarding, plans and platform questions."><link rel="canonical" href="https://satgoldcloud.name.ng/contact.html"><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/portal.css"></head>
<body class="portal-body"><header class="site-header"><a class="brand" href="/"><img src="satgold-cloud-logo.svg" alt="SatGold Cloud" width="205" height="54"></a><a class="text-link" href="/login.html">Sign in</a></header><main class="portal-main"><section class="portal-card portal-card-wide"><p class="eyebrow">CONTACT SATGOLD CLOUD</p><h1>How can we<br><span>help your school?</span></h1><p class="portal-intro">Send a note about onboarding, plans or platform questions. The team will reply to the email address you provide.</p><form id="contact-form"><div class="form-grid"><label>Your name<input name="name" autocomplete="name" required maxlength="120"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="span-two">School name <span class="optional">(optional)</span><input name="school" autocomplete="organization" maxlength="120"></label><label class="span-two">Message<textarea name="message" rows="6" minlength="10" maxlength="3000" required></textarea></label><label class="contact-trap" aria-hidden="true">Company website<input name="company" tabindex="-1" autocomplete="off"></label></div><button class="button button-wide" type="submit">Send message <span aria-hidden="true">↗</span></button><p id="form-notice" class="form-notice" aria-live="polite"></p></form></section></main><script type="module" src="assets/js/contact.js"></script></body></html>
