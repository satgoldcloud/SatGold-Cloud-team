<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#17324d"><title>Staff assistant | SatGold Cloud</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/portal.css"></head>
<body class="portal-body"><header class="site-header"><a class="brand" href="/"><img src="satgold-cloud-logo.svg" alt="SatGold Cloud" width="205" height="54"></a><div class="header-user"><a class="text-link" href="/dashboard.html">Workspace</a><button id="sign-out" class="button button-small" type="button">Sign out</button></div></header>
<main class="workspace-main ai-main"><div class="workspace-heading"><div><p class="eyebrow">STAFF SUPPORT</p><h1>SatGold assistant</h1><p id="assistant-status" class="portal-intro" aria-live="polite">Loading your access...</p></div></div><form id="assistant-form" class="assistant-card"><label>School<select id="school-id" required></select></label><label>What would you like help with?<textarea id="prompt" rows="7" minlength="5" maxlength="6000" placeholder="For example: Draft a lesson outline on fractions for Primary 5. Include a short activity and three practice questions." required></textarea></label><p class="assistant-privacy">Use drafts only. Review all output before sharing. Do not include student names, private records, or other personal information.</p><button class="button" type="submit">Generate a draft <span aria-hidden="true">↗</span></button><p id="assistant-notice" class="form-notice" aria-live="polite"></p></form><article id="assistant-output" class="assistant-output" hidden><h2>Draft response</h2><div id="assistant-text"></div></article></main><script type="module" src="assets/js/assistant.js"></script></body></html>
