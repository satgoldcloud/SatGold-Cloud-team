<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>School tools | SatGold Cloud</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/portal.css"></head><body class="portal-body"><header class="site-header"><a class="brand" href="/"><img src="satgold-cloud-logo.svg" alt="SatGold Cloud" width="205" height="54"></a><div class="header-user"><a class="text-link" href="/dashboard.html">Workspace</a><button id="sign-out" class="button button-small" type="button">Sign out</button></div></header><main class="workspace-main"><div class="workspace-heading"><div><p class="eyebrow">SCHOOL OPERATIONS</p><h1>School tools</h1><p id="tools-status" class="portal-intro" aria-live="polite">Loading your school...</p></div></div><label class="school-picker">School<select id="school-id" required></select></label><nav class="tool-tabs"><button type="button" data-tab="notifications">Notifications</button><button type="button" data-tab="attendance">Attendance</button><button type="button" data-tab="timetable">Timetable</button><button type="button" data-tab="complaints">Complaints</button><button type="button" data-tab="payroll">Payroll</button></nav><section class="tool-pane" id="notifications-pane"><div class="pane-heading"><h2>Notifications</h2><button id="read-all" class="button button-small" type="button">Mark all read</button></div><div id="notification-list" class="tool-list"></div></section><section class="tool-pane" id="attendance-pane" hidden><h2>Attendance</h2><form id="attendance-form" class="setup-card"><div class="tool-form-grid"><label>Class<select id="attendance-class" required></select></label><label>Date<input name="attendanceDate" type="date" required></label></div><div id="attendance-roster" class="tool-list"></div><button class="button" type="submit">Save attendance</button><p class="form-notice" aria-live="polite"></p></form></section><section class="tool-pane" id="timetable-pane" hidden><h2>Timetable</h2><form id="timetable-form" class="setup-card" hidden><div class="tool-form-grid"><label>Teaching assignment<select name="teacherAssignmentId" required></select></label><label>Weekday<select name="weekday" required><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="7">Sunday</option></select></label><label>Starts<input name="startsAt" type="time" required></label><label>Ends<input name="endsAt" type="time" required></label><label>Room<input name="room" maxlength="80"></label></div><button class="button" type="submit">Add period</button><p class="form-notice" aria-live="polite"></p></form><div id="timetable-list" class="tool-list"></div></section><section class="tool-pane" id="complaints-pane" hidden><h2>Complaints and enquiries</h2><form id="complaint-form" class="setup-card"><div class="tool-form-grid"><label>Subject<input name="subject" required minlength="3" maxlength="160"></label><label class="span-two">Message<textarea name="body" required minlength="3" maxlength="5000" rows="3"></textarea></label></div><button class="button" type="submit">Send enquiry</button><p class="form-notice" aria-live="polite"></p></form><div id="complaint-list" class="tool-list"></div></section><section class="tool-pane" id="payroll-pane" hidden><h2>Payroll</h2><form id="payroll-form" class="setup-card" hidden><div class="tool-form-grid"><label>Period start<input name="periodStart" type="date" required></label><label>Period end<input name="periodEnd" type="date" required></label></div><div id="payroll-roster" class="tool-list"></div><button class="button" type="submit">Create payroll draft</button><p class="form-notice" aria-live="polite"></p></form><div id="payroll-list" class="tool-list"></div></section></main><script type="module" src="assets/js/portal-tools.js"></script></body></html>
