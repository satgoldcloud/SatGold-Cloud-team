<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#17324d"><title>School setup | SatGold Cloud</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/portal.css"></head>
<body class="portal-body"><header class="site-header"><a class="brand" href="/"><img src="satgold-cloud-logo.svg" alt="SatGold Cloud" width="205" height="54"></a><div class="header-user"><a class="text-link" href="/dashboard.html">Workspace</a><button id="sign-out" class="button button-small" type="button">Sign out</button></div></header>
<main class="workspace-main"><div class="workspace-heading"><div><p class="eyebrow">SCHOOL SETUP</p><h1>Set up your school</h1><p id="setup-status" class="portal-intro" aria-live="polite">Loading school setup...</p></div></div><label class="school-picker">School<select id="school-id"></select></label><div class="setup-grid">
<form id="class-form" class="setup-card"><h2>Classes</h2><label>Class name<input name="name" required maxlength="80" placeholder="Primary 4"></label><label>Level or programme<input name="level" maxlength="80"></label><button class="button" type="submit">Add class</button><p class="form-notice" aria-live="polite"></p></form>
<form id="arm-form" class="setup-card"><h2>Class arms</h2><label>Class<select name="classId" required></select></label><label>Arm name<input name="name" required maxlength="80" placeholder="A"></label><button class="button" type="submit">Add arm</button><p class="form-notice" aria-live="polite"></p></form>
<form id="subject-form" class="setup-card"><h2>Subjects</h2><label>Subject name<input name="name" required maxlength="100"></label><label>Subject code <span class="optional">(optional)</span><input name="code" maxlength="20"></label><button class="button" type="submit">Add subject</button><p class="form-notice" aria-live="polite"></p></form>
<form id="session-form" class="setup-card"><h2>Academic session</h2><label>Session name<input name="name" required maxlength="100" placeholder="2026/2027"></label><label>Starts<input name="startsOn" type="date" required></label><label>Ends<input name="endsOn" type="date" required></label><label class="checkbox-label"><input name="isCurrent" type="checkbox"> Set as current session</label><button class="button" type="submit">Add session</button><p class="form-notice" aria-live="polite"></p></form>
<form id="staff-form" class="setup-card"><h2>Invite staff</h2><label>First name<input name="firstName" required maxlength="80"></label><label>Last name<input name="lastName" required maxlength="80"></label><label>Work email<input name="email" type="email" required maxlength="254"></label><label>Job title<input name="jobTitle" maxlength="100"></label><label>Staff type<select name="staffType"><option value="teaching">Teaching staff</option><option value="non_teaching">Non-teaching staff</option></select></label><button class="button" type="submit">Send invitation</button><p class="form-notice" aria-live="polite"></p></form>
<form id="assignment-form" class="setup-card"><h2>Assign a teacher</h2><label>Teaching staff<select name="staffId" required></select></label><label>Class<select name="classId" required></select></label><label>Class arm <span class="optional">(optional)</span><select name="classArmId"><option value="">All arms</option></select></label><label>Subject<select name="subjectId" required></select></label><label>Academic session<select name="academicSessionId" required></select></label><button class="button" type="submit">Create assignment</button><p class="form-notice" aria-live="polite"></p></form>
</div><section class="setup-card assignment-list"><h2>Teacher assignments</h2><div id="assignment-list"></div></section></main><script type="module" src="assets/js/setup.js"></script></body></html>
